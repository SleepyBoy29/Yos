<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quote of the Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFEA;--panel:#F7F8F5;--ink:#1B2A2F;--mute:#5E6C70;--line:#CBD3CE;--gold:#8A6A2F;--btn:#1B2A2F;--btnt:#F7F8F5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171A;--panel:#192125;--ink:#E9E7E0;--mute:#93A0A3;--line:#2B363B;--gold:#CBA860;--btn:#E9E7E0;--btnt:#11171A}}
:root[data-theme="dark"]{--bg:#11171A;--panel:#192125;--ink:#E9E7E0;--mute:#93A0A3;--line:#2B363B;--gold:#CBA860;--btn:#E9E7E0;--btnt:#11171A}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 20px}
.stage{width:100%;max-width:720px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:56px 36px 36px;position:relative;text-align:center}
.stage::before{content:"\201C";position:absolute;top:-6px;left:50%;transform:translateX(-50%);font:italic 500 120px/1 "Cormorant Garamond",Georgia,serif;color:var(--gold)}
#quote{font:italic 500 clamp(26px,5vw,40px)/1.35 "Cormorant Garamond",Georgia,serif;margin:36px auto 0;max-width:30em;min-height:5.4em;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#quote.out{opacity:0}
#author{margin:20px 0 0;font-weight:500;font-size:15px;color:var(--gold);letter-spacing:.04em;transition:opacity .35s}
#author::before{content:"";display:block;width:36px;height:1px;background:var(--gold);margin:0 auto 14px}
#author.out{opacity:0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:32px}
button{font:500 14px Jost,sans-serif;cursor:pointer;border-radius:3px;padding:11px 22px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button.main{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
button:hover{border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.theme{position:absolute;top:12px;right:12px;padding:6px 10px;font-size:13px;color:var(--mute)}
.toast{min-height:20px;color:var(--gold);font-size:13px;margin-top:14px}
@media (prefers-reduced-motion:reduce){#quote,#author{transition:none}}
</style>
</head>
<body>
<section class="stage" aria-live="polite">
  <button class="theme" id="theme" aria-label="Switch theme">Theme</button>
  <blockquote id="quote" style="margin-inline:auto"></blockquote>
  <p id="author"></p>
  <div class="actions">
    <button class="main" id="gen">Generate random quote</button>
    <button id="copy">Copy</button>
  </div>
  <div class="toast" id="toast"></div>
</section>

const $=id=>document.getElementById(id);
let cur=-1;
function generate(){
  let i;
  do{i=Math.floor(Math.random()*QUOTES.length)}while(i===cur&&QUOTES.length>1);
  cur=i;const q=QUOTES[i],qe=$("quote"),ae=$("author");
  qe.classList.add("out");ae.classList.add("out");
  setTimeout(()=>{qe.textContent=q.t;ae.textContent="— "+q.a;qe.classList.remove("out");ae.classList.remove("out")},180);
}
function flash(m){$("toast").textContent=m;clearTimeout(flash.t);flash.t=setTimeout(()=>$("toast").textContent="",2200)}
$("gen").onclick=generate;
$("copy").onclick=async()=>{
  const q=QUOTES[cur];if(!q)return;
  try{await navigator.clipboard.writeText("\u201C"+q.t+"\u201D — "+q.a);flash("Quote copied.")}
  catch(e){flash("Copy failed. Select the text and copy it manually.")}
};
$("theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
generate();
</script>
</body>
</html>
