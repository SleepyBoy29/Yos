<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Google Index Search (GIS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1519;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.1);--ink:#E9E7E0;--mute:#8B9A9E;--gold:#CBA860;--gold2:#E0C486}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5;
background:radial-gradient(900px 500px at 50% -10%,#1E3038 0%,transparent 70%),var(--bg);
padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
.wrap{max-width:820px;margin:0 auto;padding:72px 0 40px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{font:600 clamp(36px,7vw,60px)/1.05 "Cormorant Garamond",Georgia,serif;margin:12px 0 10px;letter-spacing:.01em}
.sub{color:var(--mute);margin:0 0 40px;font-size:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;backdrop-filter:blur(6px)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.tab{display:inline-flex;align-items:center;gap:8px;font:500 14px Jost,sans-serif;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:.2s}
.tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--ink);border-color:rgba(203,168,96,.5)}
.tab[aria-selected="true"]{color:#14100A;background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent}
.field{display:flex;gap:10px}
.input{flex:1;position:relative}
.input svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:none;stroke:var(--mute);stroke-width:1.8;stroke-linecap:round}
#q{width:100%;font:400 16px Jost,sans-serif;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:15px 16px 15px 46px;transition:.2s}
#q::placeholder{color:#62727A}
#q:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(203,168,96,.18)}
#go{font:500 15px Jost,sans-serif;letter-spacing:.04em;color:#14100A;background:linear-gradient(135deg,var(--gold2),var(--gold));border:0;border-radius:10px;padding:0 30px;cursor:pointer;transition:.2s}
#go:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.meta{margin-top:14px;font-size:13px;color:var(--mute);min-height:20px}
.meta b{font-weight:500;color:var(--gold2);letter-spacing:.06em}
.err{color:#E58C7A}
#ad{margin-top:36px;min-height:90px;text-align:center}
footer{margin-top:40px;font-size:13px}
footer a{color:var(--mute);text-decoration:none}
footer a:hover{color:var(--gold2)}
@media (max-width:560px){.field{flex-direction:column}#go{padding:14px}.wrap{padding-top:48px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">Open Directory Finder</div>
  <h1>Google Index Search</h1>
  <p class="sub">Choose a file type, enter your keywords, and search open directory listings.</p>

  <div class="panel">
    <div class="tabs" id="tabs" role="tablist" aria-label="File type"></div>
    <div class="field">
      <div class="input">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="text" placeholder="Use comma for multiple terms ..." autofocus autocomplete="off" aria-label="Search terms">
      </div>
      <button id="go" type="button">Search</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div id="ad">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7693179187997374" data-ad-slot="4998011866" data-ad-format="auto"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <footer><a href="#">&copy; SleepyBoy</a></footer>
</main>

<script>
const I={
 film:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h18M3 16h4M17 8h4M17 16h4"/>',
 audio:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-5h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-5H5a2 2 0 0 0-2 2z"/>',
 book:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
 img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 game:'<path d="M6 11h4M8 9v4"/><circle cx="15" cy="12" r=".8"/><circle cx="18" cy="10" r=".8"/><path d="M17.3 5H6.7a4 4 0 0 0-3.9 3.2l-1.6 8A3 3 0 0 0 4 20c1 0 1.9-.5 2.5-1.4L8 16h8l1.5 2.6c.6.9 1.5 1.4 2.5 1.4a3 3 0 0 0 2.8-3.8l-1.6-8A4 4 0 0 0 17.3 5z"/>',
 zip:'<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>'
};
const TYPES=[
 {n:'Video',i:'film',e:'avi|mkv|mov|mp4|mpg|wmv'},
 {n:'Audio',i:'audio',e:'ac3|flac|m4a|mp3|ogg|wav|wma'},
 {n:'Ebook',i:'book',e:'CBZ|CBR|CHM|DOC|DOCX|EPUB|MOBI|ODT|PDF|RTF|txt'},
 {n:'Pictures',i:'img',e:'bmp|gif|jpg|png|psd|tif|tiff'},
 {n:'Software/Games',i:'game',e:'apk|exe|iso|rar|tar|zip'},
 {n:'Compressed',i:'zip',e:'apk|exe|iso|rar|tar|zip|7z'}
];
const COMMON='-inurl:(jsp|pl|php|html|aspx|htm|cf|shtml) -inurl:(index_of|listen77|mp3raid|mp3toss|mp3drug|index_of|wallywashis) intitle:"index.of./"';
const $=id=>document.getElementById(id);
let cur=0;

function renderTabs(){
  $('tabs').innerHTML='';
  TYPES.forEach((t,k)=>{
    const b=document.createElement('button');
    b.className='tab';b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',k===cur);
    b.innerHTML='<svg viewBox="0 0 24 24">'+I[t.i]+'</svg>'+t.n;
    b.onclick=()=>{cur=k;renderTabs();hint();$('q').focus()};
    $('tabs').appendChild(b);
  });
}
function hint(){
  $('meta').innerHTML='Searching: <b>'+TYPES[cur].e.split('|').join(' · ')+'</b>';
}
function search(){
  const terms=$('q').value.split(',').map(s=>s.trim().replace(/"/g,'')).filter(Boolean);
  if(!terms.length){
    $('meta').innerHTML='<span class="err">Please enter at least one search term.</span>';
    $('q').focus();return;
  }
  const q=terms.map(t=>'intext:"'+t+'"').join(' ')+' ('+TYPES[cur].e+') '+COMMON;
  window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener');
  hint();
}
$('go').onclick=search;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('q').addEventListener('input',hint);
renderTabs();hint();
</script>
</body>
</html>
