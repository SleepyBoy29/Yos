<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFEA;--panel:#F7F8F5;--ink:#1B2A2F;--mute:#5E6C70;--line:#CBD3CE;--gold:#8A6A2F;--btn:#1B2A2F;--btnt:#F7F8F5;--num:#1F5F8B;--sym:#A2472E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171A;--panel:#192125;--ink:#E9E7E0;--mute:#93A0A3;--line:#2B363B;--gold:#CBA860;--btn:#E9E7E0;--btnt:#11171A;--num:#7DB7E0;--sym:#E58C7A}}
:root[data-theme="dark"]{--bg:#11171A;--panel:#192125;--ink:#E9E7E0;--mute:#93A0A3;--line:#2B363B;--gold:#CBA860;--btn:#E9E7E0;--btnt:#11171A;--num:#7DB7E0;--sym:#E58C7A}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5;padding:0 20px}
main{max-width:640px;margin:0 auto;padding:48px 0 56px}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);text-align:center}
h1{font:600 clamp(34px,7vw,52px)/1.05 "Cormorant Garamond",Georgia,serif;margin:10px 0 28px;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px}
.tab{font:500 14px Jost,sans-serif;padding:11px;border:0;background:transparent;color:var(--mute);cursor:pointer}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btnt)}
#out{font:500 clamp(20px,4.4vw,26px)/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;text-align:center;padding:22px 14px;border:1px dashed var(--line);border-radius:4px;min-height:84px;display:flex;align-items:center;justify-content:center;user-select:all}
.n{color:var(--num)}.s{color:var(--sym)}
.meter{height:5px;background:var(--line);border-radius:3px;margin-top:16px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.info{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:8px}
.info b{color:var(--ink);font-weight:500}
.actions{display:flex;gap:10px;margin-top:18px}
button.btn{flex:1;font:500 14px Jost,sans-serif;padding:12px;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.btn.main{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opts{margin-top:26px;border-top:1px solid var(--line);padding-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--mute);font-size:12px}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);flex:none}
select{font:400 14px Jost,sans-serif;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.len{display:flex;align-items:center;gap:14px;padding:14px 0 8px}
.len output{font:600 24px "Cormorant Garamond",Georgia,serif;min-width:2ch;text-align:right}
.hide{display:none}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Secure &amp; Private</div>
  <h1>Password Generator</h1>
  <div class="card">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-rand" aria-selected="true">Random</button>
      <button class="tab" role="tab" id="t-mem" aria-selected="false">Memorable</button>
    </div>

    <div id="out" aria-live="polite"></div>
    <div class="meter"><i id="bar"></i></div>
    <div class="info"><span>Strength: <b id="lvl"></b></span><span id="bits"></span></div>
    <div class="actions">
      <button class="btn main" id="gen">Generate</button>
      <button class="btn" id="copy">Copy</button>
    </div>

    <div class="opts" id="o-rand">
      <div class="len"><label for="len">Length</label><input type="range" id="len" min="8" max="64" value="16"><output id="lenv">16</output></div>
      <label class="row"><span>Uppercase letters <small>A–Z</small></span><input type="checkbox" id="up" checked></label>
      <label class="row"><span>Lowercase letters <small>a–z</small></span><input type="checkbox" id="lo" checked></label>
      <label class="row"><span>Numbers <small>0–9</small></span><input type="checkbox" id="nu" checked></label>
      <label class="row"><span>Symbols <small>! @ # $ % ^ &amp; * - _ = + ?</small></span><input type="checkbox" id="sy" checked></label>
      <label class="row"><span>Avoid look-alike characters <small>I l 1 O 0</small></span><input type="checkbox" id="am"></label>
    </div>

    <div class="opts hide" id="o-mem">
      <div class="len"><label for="wc">Words</label><input type="range" id="wc" min="3" max="10" value="5"><output id="wcv">5</output></div>
      <div class="row"><label for="sep">Separator</label>
        <select id="sep"><option value="-">Hyphen ( - )</option><option value=".">Dot ( . )</option><option value="_">Underscore ( _ )</option><option value=" ">Space</option><option value="">None</option></select></div>
      <label class="row"><span>Capitalize each word</span><input type="checkbox" id="cap" checked></label>
      <label class="row"><span>Add a number <small>2 digits at the end</small></span><input type="checkbox" id="mn" checked></label>
      <label class="row"><span>Add a symbol <small>1 symbol at the end</small></span><input type="checkbox" id="ms"></label>
    </div>
  </div>
  <p class="note">Generated in your browser with a cryptographically secure random source. Nothing is sent or stored.</p>
</main>

<script>
const WORDS=[...new Set(`apple river tiger cloud stone lemon eagle forest silver orange planet rocket garden window bridge candle dragon falcon guitar island jungle kitten ladder magnet napkin ocean pencil quartz rabbit saddle tunnel violet walnut yellow zipper anchor basket castle desert engine flower goblet harbor insect jacket kettle lantern marble needle orchid pepper quiver ribbon shadow thunder umbrella velvet whistle canyon meadow summit breeze comet dune ember fjord glacier harvest iceberg jasmine koala lagoon mango nectar otter panda quill raven sparrow tulip unicorn valley willow zebra almond bamboo cactus dolphin fern ginger honey ivory jelly kiwi lotus maple noodle olive peach quince radish sesame tomato walrus yogurt zest amber beacon copper daisy echo feather galaxy hammer indigo jewel knight lizard mirror nebula oasis pillow quest rainbow saffron temple utopia vortex wizard yonder zenith acorn badger cobalt dagger elbow fossil gadget hazel igloo jigsaw kayak lilac mosaic nutmeg onyx parrot quasar rubber sunset timber urchin voyage wombat xenon yarrow zodiac atlas bolt cedar delta ferry grove haven inlet jolly karma lunar mocha noble opera pixel quiet robot solar topaz ultra vivid waltz young zesty brave crisp dizzy eager fancy giant happy jazzy lucky merry nifty proud quick rapid sunny tidy witty bright calm gentle swift wild cozy fuzzy golden humble kind lively mighty polar royal silent tender wise brisk clever daring fierce glossy hardy jumpy keen lofty mellow nimble plucky rustic sturdy tropical vibrant woolly zany`.split(/\s+/))];
const SYM="!@#$%^&*-_=+?";
const $=id=>document.getElementById(id);
let mode="rand",pw=[],bits=0;

function rnd(n){const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
const pick=s=>s[rnd(s.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function genRandom(){
  const am=$("am").checked,strip=s=>am?s.replace(/[Il1O0]/g,""):s;
  const sets=[];
  if($("up").checked)sets.push(strip("ABCDEFGHIJKLMNOPQRSTUVWXYZ"));
  if($("lo").checked)sets.push(strip("abcdefghijklmnopqrstuvwxyz"));
  if($("nu").checked)sets.push(strip("0123456789"));
  if($("sy").checked)sets.push(SYM);
  const len=+$("len").value,all=sets.join("");
  const chars=sets.map(pick);                       // at least one from each chosen group
  while(chars.length<len)chars.push(pick(all));
  pw=shuffle(chars);bits=len*Math.log2(all.length);
}
function genMemorable(){
  const n=+$("wc").value,sep=$("sep").value,cap=$("cap").checked;
  const w=[];for(let i=0;i<n;i++){const x=pick(WORDS);w.push(cap?x[0].toUpperCase()+x.slice(1):x)}
  let s=w.join(sep);bits=n*Math.log2(WORDS.length);
  if($("mn").checked){s+=(sep||"")+String(rnd(100)).padStart(2,"0");bits+=Math.log2(100)}
  if($("ms").checked){s+=pick(SYM);bits+=Math.log2(SYM.length)}
  pw=[...s];
}
function render(){
  const out=$("out");out.textContent="";
  pw.forEach(c=>{const sp=document.createElement("span");
    if(/\d/.test(c))sp.className="n";else if(!/[A-Za-z\s]/.test(c))sp.className="s";
    sp.textContent=c;out.appendChild(sp)});
  const lv=bits<40?"Weak":bits<60?"Fair":bits<80?"Strong":"Excellent";
  $("lvl").textContent=lv;$("bits").textContent="≈ "+Math.round(bits)+" bits of entropy";
  $("bar").style.width=Math.min(bits/100,1)*100+"%";
}
function gen(){mode==="rand"?genRandom():genMemorable();render()}

function setMode(m){
  mode=m;
  $("t-rand").setAttribute("aria-selected",m==="rand");$("t-mem").setAttribute("aria-selected",m==="mem");
  $("o-rand").classList.toggle("hide",m!=="rand");$("o-mem").classList.toggle("hide",m!=="mem");
  gen();
}
$("t-rand").onclick=()=>setMode("rand");$("t-mem").onclick=()=>setMode("mem");
$("gen").onclick=gen;
$("len").oninput=e=>{$("lenv").textContent=e.target.value;gen()};
$("wc").oninput=e=>{$("wcv").textContent=e.target.value;gen()};
["up","lo","nu","sy","am"].forEach(id=>$(id).onchange=e=>{
  if(!["up","lo","nu","sy"].some(k=>$(k).checked))e.target.checked=true; // keep at least one group
  gen()});
["sep","cap","mn","ms"].forEach(id=>$(id).onchange=gen);

$("copy").onclick=async()=>{
  const t=pw.join(""),b=$("copy");
  const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1600)};
  try{await navigator.clipboard.writeText(t);done()}
  catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");done()}catch(_){b.textContent="Select & copy manually"}a.remove()}
};
gen();
</script>
</body>
</html>
