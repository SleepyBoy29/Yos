<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown & Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFEA;--panel:#F7F8F5;--ink:#1B2A2F;--mute:#5E6C70;--line:#CBD3CE;--gold:#8A6A2F;--btn:#1B2A2F;--btnt:#F7F8F5;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171A;--panel:#192125;--ink:#E9E7E0;--mute:#93A0A3;--line:#2B363B;--gold:#CBA860;--btn:#E9E7E0;--btnt:#11171A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171A;--panel:#192125;--ink:#E9E7E0;--mute:#93A0A3;--line:#2B363B;--gold:#CBA860;--btn:#E9E7E0;--btnt:#11171A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;line-height:1.5;padding:0 20px}
main{max-width:640px;margin:0 auto;padding:48px 0 56px}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);text-align:center}
h1{font:600 clamp(34px,7vw,52px)/1.05 "Cormorant Garamond",Georgia,serif;margin:10px 0 28px;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:26px 24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:26px}
.tab{font:500 14px Jost,sans-serif;padding:11px;border:0;background:transparent;color:var(--mute);cursor:pointer}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btnt)}
.hide{display:none!important}
label.f{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}
input[type=text],input[type=datetime-local],input[type=number]{width:100%;font:400 16px Jost,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:3px;padding:11px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.title{font:italic 500 26px/1.3 "Cormorant Garamond",Georgia,serif;text-align:center;margin:28px 0 6px;min-height:34px}
.blocks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.blk{border:1px solid var(--line);border-radius:4px;padding:16px 4px 12px;text-align:center}
.blk b{display:block;font:600 clamp(32px,9vw,52px)/1 "Cormorant Garamond",Georgia,serif;font-variant-numeric:tabular-nums}
.blk span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.sub{text-align:center;font-size:13px;color:var(--mute);margin-top:14px;min-height:20px}
.sub.done,.msg{color:var(--gold);font-weight:500}
.ring{position:relative;width:min(280px,76vw);aspect-ratio:1;margin:6px auto 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;stroke-dasharray:628.32;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#time{font:600 clamp(40px,12vw,60px)/1 "Cormorant Garamond",Georgia,serif;font-variant-numeric:tabular-nums}
.msg{min-height:22px;font-size:14px;margin-top:6px}
.hms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.hms input{text-align:center;font-size:22px}
.hms label{text-align:center}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.presets button{padding:7px 14px;font-size:13px}
.actions{display:flex;gap:10px;margin-top:22px}
button{font:500 14px Jost,sans-serif;cursor:pointer;border-radius:3px;padding:12px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.actions button{flex:1}
button.main{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Time, Elegantly</div>
  <h1>Countdown &amp; Timer</h1>
  <div class="card">
    <div class="tabs" role="tablist">
      <button class="tab" id="t-cd" role="tab" aria-selected="true">Countdown</button>
      <button class="tab" id="t-tm" role="tab" aria-selected="false">Timer</button>
    </div>

    <section id="p-cd">
      <div class="two">
        <div><label class="f" for="cdl">Event name (optional)</label><input type="text" id="cdl" maxlength="60" placeholder="e.g. Trip to Bali"></div>
        <div><label class="f" for="cdt">Date &amp; time</label><input type="datetime-local" id="cdt"></div>
      </div>
      <div class="title" id="cdTitle"></div>
      <div class="blocks">
        <div class="blk"><b id="cd-d">0</b><span>Days</span></div>
        <div class="blk"><b id="cd-h">00</b><span>Hours</span></div>
        <div class="blk"><b id="cd-m">00</b><span>Minutes</span></div>
        <div class="blk"><b id="cd-s">00</b><span>Seconds</span></div>
      </div>
      <div class="sub" id="cdSub"></div>
    </section>

    <section id="p-tm" class="hide">
      <div class="ring">
        <svg viewBox="0 0 220 220"><circle class="bg" cx="110" cy="110" r="100"/><circle class="fg" id="fg" cx="110" cy="110" r="100"/></svg>
        <div class="t"><div id="time">05:00</div><div class="msg" id="tmMsg"></div></div>
      </div>
      <div id="setup">
        <div class="hms">
          <div><label class="f" for="th">Hours</label><input type="number" id="th" min="0" max="99" value="0" inputmode="numeric"></div>
          <div><label class="f" for="tmn">Minutes</label><input type="number" id="tmn" min="0" max="59" value="5" inputmode="numeric"></div>
          <div><label class="f" for="ts">Seconds</label><input type="number" id="ts" min="0" max="59" value="0" inputmode="numeric"></div>
        </div>
        <div class="presets" id="presets"></div>
      </div>
      <div class="actions">
        <button class="main" id="go">Start</button>
        <button id="reset">Reset</button>
      </div>
    </section>
  </div>
</main>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const toLocalInput=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());

/* ---------- Tabs ---------- */
function tab(k){
  $("t-cd").setAttribute("aria-selected",k==="cd");$("t-tm").setAttribute("aria-selected",k==="tm");
  $("p-cd").classList.toggle("hide",k!=="cd");$("p-tm").classList.toggle("hide",k!=="tm");
}
$("t-cd").onclick=()=>tab("cd");$("t-tm").onclick=()=>tab("tm");

/* ---------- Countdown ---------- */
let cdTarget=null;
(function initCD(){
  const s=load("cd_state");
  const now=new Date();
  $("cdt").value=(s&&s.t)||toLocalInput(new Date(now.getFullYear()+1,0,1,0,0));
  $("cdl").value=(s&&s.l)||(s?"":"New Year");
  readCD();
})();
function readCD(){
  const v=$("cdt").value,d=v?new Date(v):null;
  cdTarget=d&&!isNaN(d)?d:null;
  save("cd_state",{t:$("cdt").value,l:$("cdl").value});
  drawCD();
}
$("cdt").oninput=readCD;$("cdl").oninput=readCD;
function drawCD(){
  const l=$("cdl").value.trim();
  $("cdTitle").textContent=l?"until "+l:"";
  if(!cdTarget){["d","h","m","s"].forEach(k=>$("cd-"+k).textContent="–");$("cdSub").className="sub";$("cdSub").textContent="Pick a date and time.";return}
  let diff=cdTarget-Date.now();const over=diff<=0;if(over)diff=0;
  const sec=Math.floor(diff/1000);
  $("cd-d").textContent=Math.floor(sec/86400);
  $("cd-h").textContent=pad(Math.floor(sec%86400/3600));
  $("cd-m").textContent=pad(Math.floor(sec%3600/60));
  $("cd-s").textContent=pad(sec%60);
  $("cdSub").className="sub"+(over?" done":"");
  $("cdSub").textContent=over?"The moment has arrived.":cdTarget.toLocaleString([],{dateStyle:"full",timeStyle:"short"});
}

/* ---------- Timer ---------- */
const C=628.32;
let T={state:"idle",total:0,left:0,end:0},ctx=null;
[1,5,10,25,45,60].forEach(m=>{
  const b=document.createElement("button");b.textContent=m===60?"1 hr":m+" min";
  b.onclick=()=>{if(T.state!=="idle")return;$("th").value=m===60?1:0;$("tmn").value=m===60?0:m;$("ts").value=0;drawTM()};
  $("presets").appendChild(b);
});
const clamp=(el,max)=>{let v=parseInt(el.value,10);if(isNaN(v)||v<0)v=0;if(v>max)v=max;el.value=v;return v};
function setupMs(){return(clamp($("th"),99)*3600+clamp($("tmn"),59)*60+clamp($("ts"),59))*1000}
function fmt(ms,showH){const s=Math.ceil(ms/1000),H=Math.floor(s/3600);return(showH||H?pad(H)+":":"")+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function drawTM(){
  const idle=T.state==="idle",ms=idle?setupMs():T.left,tot=idle?ms:T.total;
  $("time").textContent=fmt(ms,tot>=3600000);
  $("fg").style.strokeDashoffset=C*(1-(tot?ms/tot:0))*(idle?0:1);
  const run=T.state==="running";
  document.title=run?fmt(ms,tot>=3600000)+" · Timer":"Countdown & Timer";
}
["th","tmn","ts"].forEach(id=>$(id).oninput=()=>{if(T.state==="idle")drawTM()});
function beep(){
  try{
    ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();
    let t=ctx.currentTime;
    for(let i=0;i<3;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.start(t);o.stop(t+.45);t+=.6}
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
}
function ui(){
  const s=T.state;
  $("setup").classList.toggle("hide",s!=="idle");
  $("go").textContent=s==="idle"?"Start":s==="running"?"Pause":s==="paused"?"Resume":"Restart";
}
$("go").onclick=()=>{
  try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume&&ctx.resume()}catch(e){} // unlock sound on user click
  const s=T.state;$("tmMsg").textContent="";
  if(s==="idle"){const ms=setupMs();if(!ms){$("tmMsg").textContent="Set a time first.";return}
    T.total=T.left=ms;T.end=Date.now()+ms;T.state="running"}
  else if(s==="running"){T.left=Math.max(0,T.end-Date.now());T.state="paused"}
  else if(s==="paused"){T.end=Date.now()+T.left;T.state="running"}
  else{T.left=T.total;T.end=Date.now()+T.left;T.state="running"}
  ui();drawTM();
};
$("reset").onclick=()=>{T.state="idle";$("tmMsg").textContent="";ui();drawTM()};

/* ---------- Loop ---------- */
setInterval(()=>{
  drawCD();
  if(T.state==="running"){
    T.left=Math.max(0,T.end-Date.now());
    if(T.left===0){T.state="done";$("tmMsg").textContent="Time's up";beep();ui()}
    drawTM();
  }
},200);
ui();drawTM();
</script>
</body>
</html>
