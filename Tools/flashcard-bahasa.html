<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard // Bahasa Dunia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c0f;
    --bg-grid: #0e1114;
    --panel: #14171c;
    --panel-2: #191d23;
    --border: #262b33;
    --border-soft: #1d2129;
    --text: #e9ebee;
    --muted: #7d8695;
    --muted-2: #4c525c;
    --accent: #7dd3fc;
    --accent-dim: rgba(125,211,252,0.12);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Noto Sans','Noto Sans SC','Noto Sans Devanagari','Noto Sans Arabic','Noto Sans Bengali', 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% -10%, rgba(125,211,252,0.06), transparent 40%),
      radial-gradient(circle at 90% 110%, rgba(196,181,253,0.05), transparent 40%),
      repeating-linear-gradient(0deg, var(--bg-grid) 0px, var(--bg-grid) 1px, var(--bg) 1px, var(--bg) 32px),
      repeating-linear-gradient(90deg, var(--bg-grid) 0px, var(--bg-grid) 1px, var(--bg) 1px, var(--bg) 32px);
    background-color:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .app{ width:100%; max-width:620px; }

  /* header */
  .head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .brand{ font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase;}
  .brand b{ color:var(--accent); }
  h1{
    font-family:var(--sans); font-weight:700; font-size:26px; margin:4px 0 0; letter-spacing:-0.01em;
  }
  .sub{ font-family:var(--mono); font-size:11.5px; color:var(--muted-2); margin-top:4px; }

  /* language tabs */
  .tabs{
    display:flex; flex-wrap:wrap; gap:6px; padding:4px 2px 14px; margin-bottom:6px;
  }
  .tab{
    flex:0 0 auto; font-family:var(--mono); font-size:12px; padding:8px 12px; border-radius:7px;
    background:var(--panel); border:1px solid var(--border-soft); color:var(--muted);
    cursor:pointer; display:flex; align-items:center; gap:7px; transition:all .15s ease; white-space:nowrap;
  }
  .tab .dot{ width:6px; height:6px; border-radius:50%; background:var(--dot,#555); }
  .tab:hover{ border-color:var(--border); color:var(--text); }
  .tab.active{ background:var(--accent-dim); border-color:var(--tab-color); color:var(--text); }

  /* stage */
  .stage{ position:relative; margin-top:6px; }
  .meta-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:11px; color:var(--muted-2); margin-bottom:10px; padding:0 2px;
  }
  .meta-row .freq{ color:var(--accent); }
  .meta-row .idx{ letter-spacing:.05em; }

  .perspective{ perspective:1600px; width:100%; }
  .card{
    position:relative; width:100%; height:320px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.22,.68,.2,1.06);
    animation:enter .35s ease;
  }
  @keyframes enter{ from{ opacity:0; transform:translateY(8px) scale(.985);} to{opacity:1; transform:translateY(0) scale(1);} }
  .card.flipped{ transform:rotateY(180deg); }
  .card.flipped.enter-anim{ animation:none; }

  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:16px; border:1px solid var(--border);
    background:linear-gradient(155deg, var(--panel), var(--panel-2));
    display:flex; flex-direction:column;
    padding:22px 22px 18px;
    box-shadow: 0 20px 40px -18px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.02);
  }
  .face::before{
    content:''; position:absolute; left:0; right:0; top:0; height:3px; border-radius:16px 16px 0 0;
    background:var(--tab-color);
  }
  .face-front{ align-items:flex-start; justify-content:center; }
  .face-back{ transform:rotateY(180deg); align-items:flex-start; justify-content:center; }

  .tag-row{ position:absolute; top:16px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; }
  .lang-chip{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; color:var(--tab-color);
    border:1px solid var(--tab-color); padding:3px 7px; border-radius:5px; background:rgba(255,255,255,0.02);
  }
  .card-no{ font-family:var(--mono); font-size:10.5px; color:var(--muted-2); }

  .content-wrap{ width:100%; margin-top:20px; }
  .main-text{
    font-size:30px; font-weight:600; line-height:1.35; color:var(--text); word-break:break-word;
  }
  .face-back .main-text{ color:var(--text); font-size:26px; }
  .pron{
    font-family:var(--mono); font-size:13.5px; color:var(--muted); margin-top:10px; letter-spacing:.01em;
  }
  .id-label{
    font-family:var(--mono); font-size:10.5px; color:var(--tab-color); letter-spacing:.15em; margin-bottom:8px; text-transform:uppercase;
  }
  .flip-hint{
    position:absolute; bottom:14px; right:20px; font-family:var(--mono); font-size:10px; color:var(--muted-2);
    display:flex; align-items:center; gap:5px;
  }

  /* progress */
  .progress-track{
    height:3px; background:var(--border-soft); border-radius:3px; margin:18px 2px 4px; overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--tab-color); transition:width .3s ease; }

  /* controls */
  .controls{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:18px; }
  .side-controls{ display:flex; gap:8px; }
  btn{ display:none; }
  .ctrl-btn{
    font-family:var(--mono); font-size:13px; color:var(--text); background:var(--panel);
    border:1px solid var(--border); padding:11px 14px; border-radius:9px; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:all .15s ease;
  }
  .ctrl-btn:hover{ border-color:var(--tab-color); color:var(--tab-color); }
  .ctrl-btn:active{ transform:scale(.96); }
  .ctrl-btn.primary{ background:var(--tab-color); color:#0a0c0f; border-color:var(--tab-color); font-weight:600; flex:1; justify-content:center; }
  .ctrl-btn.primary:hover{ opacity:.9; color:#0a0c0f; }
  .ctrl-btn.icon{ padding:11px 13px; }
  .ctrl-btn.small{ font-size:11px; padding:9px 11px; color:var(--muted); }

  .footer-note{
    font-family:var(--mono); font-size:10.5px; color:var(--muted-2); text-align:center; margin-top:22px; line-height:1.7;
  }
  kbd{ background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:var(--mono); font-size:10px; color:var(--muted);}

  @media (max-width:480px){
    .card{ height:300px; }
    .main-text{ font-size:24px; }
    h1{ font-size:22px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <div>
      <div class="brand">flashcard.exe &mdash; <b>12 bahasa → Indonesia</b></div>
      <h1>Kartu Bahasa Dunia</h1>
      <div class="sub">terurut dari kalimat paling umum → paling jarang</div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="stage">
    <div class="meta-row">
      <span class="idx" id="idxLabel">001 / 020</span>
      <span class="freq" id="freqLabel">● sangat umum</span>
    </div>

    <div class="perspective">
      <div class="card" id="card">
        <div class="face face-front" id="faceFront">
          <div class="tag-row">
            <span class="lang-chip" id="chipFront">EN</span>
            <span class="card-no" id="cardNoFront">#001</span>
          </div>
          <div class="content-wrap">

          <div class="flip-hint">tap untuk membalik ↻</div>
        </div>
        <div class="face face-back" id="faceBack">

            <span class="card-no" id="cardNoBack">#001</span>
          </div>
          <div class="content-wrap">
            <div class="id-label">artinya</div>
            <div class="main-text" id="textBack">Halo</div>
          </div>
          <div class="flip-hint">tap untuk kembali ↻</div>
        </div>
      </div>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:5%"></div></div>

    <div class="controls">
      <button class="ctrl-btn icon" id="prevBtn" title="Sebelumnya (←)">←</button>
      <button class="ctrl-btn primary" id="flipBtn">Balik kartu <span style="opacity:.6">(spasi)</span></button>
      <button class="ctrl-btn icon" id="nextBtn" title="Berikutnya (→)">→</button>
    </div>
    <div class="controls" style="margin-top:8px;">
      <button class="ctrl-btn small" id="shuffleBtn">⤮ Acak urutan</button>
      <button class="ctrl-btn small" id="resetBtn">↺ Urutkan ulang</button>
    </div>
  </div>

  <div class="footer-note">
    <kbd>←</kbd> <kbd>→</kbd> pindah kartu &nbsp;•&nbsp; <kbd>space</kbd> balik kartu &nbsp;•&nbsp; pilih tab bahasa di atas untuk berganti bahasa
  </div>

</div>

let currentLangIdx = 0;
let order = [];
let cursor = 0;
let flipped = false;

const tabsEl = document.getElementById('tabs');
const cardEl = document.getElementById('card');
const chipFront = document.getElementById('chipFront');
const textFront = document.getElementById('textFront');
const pronFront = document.getElementById('pronFront');
const textBack = document.getElementById('textBack');
const cardNoFront = document.getElementById('cardNoFront');
const cardNoBack = document.getElementById('cardNoBack');
const idxLabel = document.getElementById('idxLabel');
const freqLabel = document.getElementById('freqLabel');
const progressFill = document.getElementById('progressFill');

function buildTabs(){
  tabsEl.innerHTML = '';
  LANGS.forEach((l, i)=>{
    const tab = document.createElement('div');
    tab.className = 'tab' + (i===currentLangIdx ? ' active' : '');
    tab.style.setProperty('--dot', l.color);
    tab.style.setProperty('--tab-color', l.color);
    tab.innerHTML = `<span class="dot"></span>${l.code} · ${l.name}`;
    tab.onclick = ()=> switchLang(i);
    tabsEl.appendChild(tab);
  });
}

function switchLang(i){
  currentLangIdx = i;
  resetOrder();
  buildTabs();
  render(true);
}

function resetOrder(){
  order = LANGS[currentLangIdx].words.map((_, i)=>i);
  cursor = 0;
  flipped = false;
}

function shuffleOrder(){
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  cursor = 0;
  flipped = false;
  render(true);
}

function freqTag(pos, total){
  const ratio = pos/total;
  if(ratio < 0.35) return '● sangat umum';
  if(ratio < 0.7) return '● umum';
  return '● jarang digunakan';
}

function render(animate){
  const lang = LANGS[currentLangIdx];
  const wIdx = order[cursor];
  const word = lang.words[wIdx];
  const total = lang.words.length;

  document.documentElement.style.setProperty('--tab-color', lang.color);
  document.querySelectorAll('.face').forEach(f=> f.style.setProperty('--tab-color', lang.color));
  document.querySelectorAll('.ctrl-btn').forEach(b=> b.style.setProperty('--tab-color', lang.color));
  document.getElementById('progressFill').style.setProperty('--tab-color', lang.color);

  chipFront.textContent = lang.code;
  chipFront.style.setProperty('--tab-color', lang.color);
  chipFront.style.color = lang.color;
  chipFront.style.borderColor = lang.color;

  textFront.textContent = word.t;
  pronFront.textContent = word.p ? `/ ${word.p} /` : '';
  textBack.textContent = word.id;

  const num = String(wIdx+1).padStart(3,'0');
  cardNoFront.textContent = '#' + num;
  cardNoBack.textContent = '#' + num;
  idxLabel.textContent = `${String(cursor+1).padStart(3,'0')} / ${String(total).padStart(3,'0')}`;
  freqLabel.textContent = freqTag(wIdx, total);
  progressFill.style.width = ((cursor+1)/total*100) + '%';

  flipped = false;
  cardEl.classList.remove('flipped');
  if(animate){
    cardEl.style.animation = 'none';
    void cardEl.offsetWidth;
    cardEl.style.animation = '';
  }
}

function flipCard(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function next(){
  cursor = (cursor + 1) % order.length;
  render(true);
}
function prev(){
  cursor = (cursor - 1 + order.length) % order.length;
  render(true);
}

cardEl.addEventListener('click', flipCard);
document.getElementById('flipBtn').addEventListener('click', flipCard);
document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('shuffleBtn').addEventListener('click', shuffleOrder);
document.getElementById('resetBtn').addEventListener('click', ()=>{ resetOrder(); render(true); });

document.addEventListener('keydown', (e)=>{
  if(e.code === 'ArrowRight'){ next(); }
  else if(e.code === 'ArrowLeft'){ prev(); }
  else if(e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); flipCard(); }
});

// simple swipe support
let touchStartX = null;
cardEl.addEventListener('touchstart', e=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
cardEl.addEventListener('touchend', e=>{
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 50){ dx > 0 ? prev() : next(); }
  touchStartX = null;
});

buildTabs();
resetOrder();
render(false);
</script>
