<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frog Leap: a jumping puzzle</title>
<style>
  :root {
    --deep: #0c2f33;
    --pond: #14555a;
    --pond-hi: #1d7073;
    --pad: #8ad06a;
    --pad-dark: #4c9a4a;
    --ink: #e8f5ee;
    --muted: #9cc7bf;
    --accent: #ffd54a;
    --green: #4cb963;
    --orange: #f07a3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% 0%, #185c5e 0%, var(--deep) 60%, #07201f 100%);
    color: var(--ink);
    font-family: "Avenir Next Rounded", "Nunito", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; touch-action: manipulation; }

  .app {
    width: 100%;
    max-width: 760px;
    padding: 24px 24px 36px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 7vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .rules {
    margin: 8px 0 0;
    max-width: 52ch;
    color: var(--muted);
    line-height: 1.5;
  }

  /* Level picker */
  .levels { display: flex; flex-wrap: wrap; gap: 8px; }
  .level {
    display: flex; flex-direction: column; align-items: flex-start;
    padding: 8px 16px;
    background: rgba(255,255,255,.06);
    border: 2px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    line-height: 1.2;
    transition: background .15s, border-color .15s;
  }
  .level b { font-weight: 800; }
  .level span { font-size: .8rem; color: var(--muted); }
  .level:hover { background: rgba(255,255,255,.12); }
  .level[aria-pressed="true"] { border-color: var(--accent); background: rgba(255,213,74,.12); }

  /* Stats */
  .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0; }
  .hud div { background: rgba(0,0,0,.22); border-radius: 14px; padding: 10px 14px; }
  .hud dt { font-size: .82rem; color: var(--muted); }
  .hud dd { margin: 2px 0 0; font-size: 1.7rem; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* Pond */
  .water {
    --cell: min(84px, calc((min(100vw, 760px) - 72px) / var(--count, 7)));
    position: relative;
    display: flex;
    justify-content: center;
    padding: calc(var(--cell) * .55) 12px 14px;
    border-radius: 28px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px),
      linear-gradient(180deg, var(--pond-hi), var(--pond));
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.06), 0 18px 40px rgba(0,0,0,.35);
  }
  .pond {
    position: relative;
    width: calc(var(--count) * var(--cell));
    height: calc(var(--cell) * 1.4);
  }
  .pad {
    position: absolute;
    left: calc(var(--x) * var(--cell) + var(--cell) * .03);
    top: calc(var(--cell) * .64);
    width: calc(var(--cell) * .94);
    height: calc(var(--cell) * .62);
    filter: drop-shadow(0 5px 3px rgba(0,0,0,.28));
  }
  .pad svg { width: 100%; height: 100%; display: block; }
  .pad .leaf { fill: var(--pad); stroke: var(--pad-dark); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .pad .vein { stroke: var(--pad-dark); stroke-width: 1.5; opacity: .7; vector-effect: non-scaling-stroke; }

  .frog {
    --skin: var(--green); --shade: #2f8a47; --belly: #c2eeaa;
    position: absolute;
    left: calc(var(--x) * var(--cell));
    top: calc(var(--cell) * .2);
    width: var(--cell);
    height: calc(var(--cell) * .8);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    z-index: 2;
    border-radius: 14px;
    transition: left .34s cubic-bezier(.3, .7, .4, 1);
  }
  .frog.orange { --skin: var(--orange); --shade: #c4531f; --belly: #ffd7a8; }
  .frog:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sprite { display: block; width: 100%; height: 100%; transform-origin: 50% 90%; }
  .frog svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .frog.orange svg { transform: scaleX(-1); }
  .skin { fill: var(--skin); }
  .shade { fill: var(--shade); }
  .belly { fill: var(--belly); }

  .frog.hop .sprite { animation: hop .34s ease-out; }
  @keyframes hop {
    0%   { transform: translateY(0) scale(1.08, .88); }
    45%  { transform: translateY(var(--hop, -55%)) scale(.94, 1.1); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .frog.shake .sprite { animation: shake .3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6%); }
    75% { transform: translateX(6%); }
  }
  .frog.hint .sprite {
    filter: drop-shadow(0 0 7px var(--accent)) drop-shadow(0 0 2px var(--accent));
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.09); }
  }

  /* Win panel */
  .win {
    position: absolute; inset: 0;
    display: grid; place-content: center; justify-items: center; gap: 8px;
    padding: 20px;
    text-align: center;
    background: rgba(7, 32, 31, .82);
    border-radius: inherit;
    z-index: 5;
  }
  .win[hidden] { display: none; }
  .win h2 { margin: 0; font-size: clamp(1.4rem, 5vw, 2rem); }
  .win p { margin: 0 0 8px; color: var(--muted); max-width: 32ch; line-height: 1.4; }
  .win .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  .message {
    min-height: 1.5em;
    margin: 0;
    text-align: center;
    color: var(--ink);
  }

  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: .92rem; }
  .legend li { display: flex; align-items: center; gap: 8px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .dot.g { background: var(--green); }
  .dot.o { background: var(--orange); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .btn {
    padding: 11px 20px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn:hover:not(:disabled) { background: rgba(255,255,255,.18); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:focus-visible, .level:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: #2a2200; }
  .btn.primary:hover:not(:disabled) { background: #ffe07a; }

  @media (max-width: 480px) {
    .app { padding: 16px 12px 28px; gap: 14px; }
    .hud dd { font-size: 1.4rem; }
    .btn { padding: 10px 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .frog { transition: none; }
    .frog.hop .sprite, .frog.shake .sprite, .frog.hint .sprite { animation: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Frog Leap</h1>
    <p class="rules">Swap the green and orange frogs. Frogs only move forward: one step onto an empty pad, or a jump over a single frog.</p>
  </header>

  <nav class="levels" id="levels" aria-label="Choose a level"></nav>

  <dl class="hud">
    <div><dt>Moves</dt><dd id="moves">0</dd></div>
    <div><dt>Your best</dt><dd id="best">-</dd></div>
    <div><dt>Fewest possible</dt><dd id="target">-</dd></div>
  </dl>

  <section class="water" id="water" aria-label="Pond">
    <div class="pond" id="pond"></div>
    <div class="win" id="win" hidden role="dialog" aria-labelledby="winTitle">
      <h2 id="winTitle">Everyone made it across!</h2>
      <p id="winText"></p>
      <div class="row">
        <button class="btn" id="replay" type="button">Replay level</button>
        <button class="btn primary" id="next" type="button">Next level</button>
      </div>
    </div>
  </section>

  <p class="message" id="message" aria-live="polite">Tap a frog to make it jump.</p>

  <ul class="legend">
    <li><span class="dot g"></span>Green frogs go right</li>
    <li><span class="dot o"></span>Orange frogs go left</li>
  </ul>

  <div class="actions">
    <button class="btn" id="undo" type="button">Undo</button>
    <button class="btn" id="hint" type="button">Hint</button>
    <button class="btn" id="restart" type="button">Restart</button>
    <button class="btn" id="sound" type="button" aria-pressed="true">Sound on</button>
  </div>
</main>

<script>
(() => {
  const LEVELS = [
    { name: 'Easy',   n: 2 },
    { name: 'Medium', n: 3 },
    { name: 'Hard',   n: 4 },
    { name: 'Master', n: 5 },
  ];

  const FROG = `<svg viewBox="0 0 100 80" aria-hidden="true">
    <ellipse class="shade" cx="30" cy="60" rx="22" ry="13"/>
    <ellipse class="skin" cx="50" cy="46" rx="34" ry="24"/>
    <ellipse class="belly" cx="52" cy="58" rx="24" ry="10"/>
    <ellipse class="skin" cx="72" cy="40" rx="20" ry="16"/>
    <ellipse class="shade" cx="66" cy="68" rx="10" ry="6"/>
    <circle class="skin" cx="63" cy="27" r="8"/>
    <circle class="skin" cx="76" cy="27" r="9"/>
    <circle cx="63" cy="27" r="4.5" fill="#fff"/>
    <circle cx="76" cy="26" r="6" fill="#fff"/>
    <circle cx="65" cy="27" r="2.2" fill="#16302e"/>
    <circle cx="78" cy="26" r="3" fill="#16302e"/>
    <path d="M64 48 Q80 55 91 46" fill="none" stroke="#16302e" stroke-width="2" stroke-linecap="round"/>
  </svg>`;

  const PAD = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path class="leaf" d="M50 50 L61.4 7.5 A44 44 0 1 0 78.3 16.3 Z"/>
    <path class="vein" d="M50 50 L20 30 M50 50 L14 58 M50 50 L34 88 M50 50 L72 90 M50 50 L88 62"/>
  </svg>`;

  const $ = (s) => document.querySelector(s);
  const water = $('#water'), pond = $('#pond'), win = $('#win');
  const movesEl = $('#moves'), bestEl = $('#best'), targetEl = $('#target'), msgEl = $('#message');
  const undoBtn = $('#undo'), hintBtn = $('#hint'), soundBtn = $('#sound');

  const best = {};
  let level = 0, frogs = [], frogEls = new Map();
  let moves = 0, history = [], solved = false, hintId = null;

  /* ---------- Sound ---------- */
  let audio = null, soundOn = true;
  function tone(f0, f1, dur, delay = 0, vol = 0.07) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime + delay;
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audio.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    } catch (e) { /* audio unavailable */ }
  }

  /* ---------- Setup ---------- */
  function buildLevelButtons() {
    const nav = $('#levels');
    nav.innerHTML = '';
    LEVELS.forEach((L, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'level';
      b.innerHTML = `<b>${L.name}</b><span>${L.n} + ${L.n} frogs</span>`;
      b.addEventListener('click', () => newGame(i));
      nav.appendChild(b);
    });
  }

  function newGame(idx) {
    level = idx;
    const n = LEVELS[idx].n, count = 2 * n + 1;
    frogs = [];
    for (let i = 0; i < n; i++) frogs.push({ id: i, type: 'green', pos: i });
    for (let i = 0; i < n; i++) frogs.push({ id: n + i, type: 'orange', pos: n + 1 + i });
    moves = 0; history = []; solved = false; hintId = null;
    win.hidden = true;

    water.style.setProperty('--count', count);
    pond.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'pad';
      p.style.setProperty('--x', i);
      p.innerHTML = PAD;
      pond.appendChild(p);
    }
    frogEls = new Map();
    frogs.forEach((f) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'frog ' + f.type;
      b.style.setProperty('--x', f.pos);
      b.innerHTML = `<span class="sprite">${FROG}</span>`;
      b.addEventListener('click', () => tap(f));
      b.addEventListener('animationend', () => b.classList.remove('hop', 'shake'));
      pond.appendChild(b);
      frogEls.set(f.id, b);
    });
    setMsg('Tap a frog to make it jump.');
    update();
  }

  /* ---------- Rules ---------- */
  const at = (pos) => frogs.find((f) => f.pos === pos);
  function targetFor(f) {
    const count = 2 * LEVELS[level].n + 1;
    const d = f.type === 'green' ? 1 : -1;
    const t1 = f.pos + d, t2 = f.pos + 2 * d;
    if (t1 < 0 || t1 >= count) return null;
    if (!at(t1)) return t1;
    if (t2 >= 0 && t2 < count && !at(t2)) return t2;
    return null;
  }
  function isSolved() {
    const n = LEVELS[level].n;
    return frogs.every((f) => (f.type === 'green' ? f.pos > n : f.pos < n));
  }

  /* ---------- Actions ---------- */
  function tap(f) {
    if (solved) return;
    const t = targetFor(f);
    const el = frogEls.get(f.id);
    if (t === null) {
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
      setMsg('That frog is blocked. Frogs only move forward.');
      tone(160, 110, 0.12);
      return;
    }
    history.push(frogs.map((x) => x.pos));
    const dist = Math.abs(t - f.pos);
    f.pos = t;
    moves++;
    hintId = null;

    el.style.setProperty('--hop', dist > 1 ? '-80%' : '-55%');
    el.classList.remove('hop'); void el.offsetWidth; el.classList.add('hop');
    tone(dist > 1 ? 300 : 360, dist > 1 ? 620 : 520, 0.12);

    setMsg('Tap a frog to make it jump.');
    update();

    if (isSolved()) return finish();
    if (frogs.every((x) => targetFor(x) === null)) {
      setMsg('No moves left. Undo a few jumps or restart.');
    }
  }

  function finish() {
    solved = true;
    const n = LEVELS[level].n, target = n * n + 2 * n;
    if (!best[level] || moves < best[level]) best[level] = moves;
    $('#winText').textContent = moves === target
      ? `Solved in ${moves} moves, the fewest possible.`
      : `Solved in ${moves} moves. The fewest possible is ${target}.`;
    $('#next').hidden = level === LEVELS.length - 1;
    update();
    setTimeout(() => {
      win.hidden = false;
      (level === LEVELS.length - 1 ? $('#replay') : $('#next')).focus();
    }, 450);
    tone(392, 392, 0.14, 0.05); tone(494, 494, 0.14, 0.2); tone(587, 587, 0.14, 0.35); tone(784, 784, 0.3, 0.5);
  }

  function undo() {
    if (!history.length) return;
    const prev = history.pop();
    frogs.forEach((f, i) => (f.pos = prev[i]));
    moves = Math.max(0, moves - 1);
    solved = false; hintId = null;
    win.hidden = true;
    setMsg('Tap a frog to make it jump.');
    update();
  }

  function hint() {
    if (solved) return;
    const n = LEVELS[level].n;
    const cells = Array(2 * n + 1).fill('.');
    frogs.forEach((f) => (cells[f.pos] = f.type === 'green' ? 'G' : 'O'));
    const from = solveFrom(cells, n);
    if (from === null) {
      setMsg("This position can't be solved. Undo a few jumps.");
      return;
    }
    hintId = at(from).id;
    setMsg('Try the glowing frog.');
    update();
  }

  // Breadth-first search for the shortest solution; returns the pad index of the first frog to move.
  function solveFrom(cells, n) {
    const goal = 'O'.repeat(n) + '.' + 'G'.repeat(n);
    const start = cells.join('');
    if (start === goal) return null;
    const queue = [[start, null]];
    const seen = new Set([start]);
    for (let h = 0; h < queue.length; h++) {
      const [s, first] = queue[h];
      const arr = s.split('');
      for (let i = 0; i < arr.length; i++) {
        const c = arr[i];
        if (c === '.') continue;
        const d = c === 'G' ? 1 : -1;
        let t = null;
        if (arr[i + d] === '.') t = i + d;
        else if (arr[i + d] && arr[i + 2 * d] === '.') t = i + 2 * d;
        if (t === null) continue;
        const next = arr.slice();
        next[t] = c; next[i] = '.';
        const ns = next.join('');
        if (seen.has(ns)) continue;
        seen.add(ns);
        const f = first === null ? i : first;
        if (ns === goal) return f;
        queue.push([ns, f]);
      }
    }
    return null;
  }

  /* ---------- Render ---------- */
  function setMsg(t) { msgEl.textContent = t; }

  function update() {
    const n = LEVELS[level].n, count = 2 * n + 1;
    frogs.forEach((f) => {
      const el = frogEls.get(f.id);
      el.style.setProperty('--x', f.pos);
      el.classList.toggle('hint', f.id === hintId);
      el.setAttribute('aria-label', `${f.type} frog on pad ${f.pos + 1} of ${count}`);
    });
    movesEl.textContent = moves;
    bestEl.textContent = best[level] ?? '-';
    targetEl.textContent = n * n + 2 * n;
    undoBtn.disabled = history.length === 0;
    document.querySelectorAll('.level').forEach((b, i) =>
      b.setAttribute('aria-pressed', String(i === level)));
  }

  /* ---------- Wiring ---------- */
  undoBtn.addEventListener('click', undo);
  hintBtn.addEventListener('click', hint);
  $('#restart').addEventListener('click', () => newGame(level));
  $('#replay').addEventListener('click', () => newGame(level));
  $('#next').addEventListener('click', () => newGame(Math.min(level + 1, LEVELS.length - 1)));
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  });
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'u' || k === 'z') undo();
    else if (k === 'h') hint();
    else if (k === 'r') newGame(level);
  });

  buildLevelButtons();
  newGame(0);
})();
</script>
</body>
</html>
